services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - OIDC_CLIENT_ID=Mock-ID
      - OIDC_CLIENT_SECRET=Mock-Secret
      - OIDC_ISSUER=http://mock-oidc:8080/default
    command: >-
      sh -c "pip install --no-cache-dir 'Django>=6.1,<6.2' authlib requests psycopg[binary] &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mock-oidc:
    image: ghcr.io/meigma/mock-oidc:v0.1.1
    ports:
      - "8080:8080"

volumes:
  frontend_node_modules:
  postgres_data:
